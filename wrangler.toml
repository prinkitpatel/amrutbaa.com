name = "amrutbaa-com"
main = "worker.js"
compatibility_date = "2026-01-17"

[assets]
directory = "."
exclude = [
    ".git",
    "node_modules",
    ".wrangler",
    ".github",
    ".vscode",
    "lighthouse-report*.json",
    "*.md",
    "wrangler.toml",
    ".gitignore",
    ".assetsignore",
    "config.example.js"
]

# Environment variables (set these via Cloudflare dashboard or CLI)
# RAZORPAY_KEY_ID = "your_key_id"
# RAZORPAY_KEY_SECRET = "your_key_secret"
